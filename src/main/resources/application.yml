spring:
  application:
    name: api
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api}
    username: ${DB_USER:api}
    # Kein Default: fehlt DB_PASSWORD, schlägt der Start fehl (fail-fast) statt still
    # ein schwaches Default-Passwort zu verwenden (#270). Dev-Wert kommt aus .env.
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Default zeigt auf die lokale Keycloak-Dev-Instanz (Docker, Host-Port 8081).
          # Profile dev/prod/docker ueberschreiben diesen Wert in den jeweiligen application-*.yml.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/toolbox-dev}

# App-Version (#229): Shared-Secret fuer die mutierenden increment-Endpunkte. Leer = deny
# (anonymer Schreibzugriff ist dann gesperrt). Auf dem Server via Env/.env setzen; das
# Deploy-Skript (#225) sendet denselben Wert als X-Version-Token-Header.
app:
  version:
    increment-secret: ${APP_VERSION_INCREMENT_SECRET:}

python-tools:
  url: ${PYTHON_TOOLS_URL:http://localhost:8000}
  connect-timeout: ${PYTHON_TOOLS_CONNECT_TIMEOUT:5s}
  read-timeout: ${PYTHON_TOOLS_READ_TIMEOUT:30s}
  # Internal-Auth (#265): Shared Secret, das Spring als X-Internal-Key-Header sendet.
  internal-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

# OpenAPI-Doku (#96, oeffentlich seit #166): hinter dem normalen /api-Prefix.
# Spec + Swagger-UI sind ohne Token erreichbar (siehe SecurityConfig permitAll).
# Springdoc-Default-Pfade /v3/api-docs und /swagger-ui werden auf die
# Toolbox-Konvention (/api/openapi, /api/swagger-ui.html) angepasst.
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui.html
    config-url: /api/openapi/swagger-config
    url: /api/openapi
