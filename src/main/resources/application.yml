spring:
  application:
    name: api
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api}
    username: ${DB_USER:api}
    password: ${DB_PASSWORD:api}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

python-tools:
  url: ${PYTHON_TOOLS_URL:http://localhost:8000}
  connect-timeout: ${PYTHON_TOOLS_CONNECT_TIMEOUT:5s}
  read-timeout: ${PYTHON_TOOLS_READ_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
