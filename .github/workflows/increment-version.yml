name: Increment app version (minor)

# Nach jedem Push auf main wird die Minor-Version der laufenden Anwendung um eins
# erhoeht. Der Aufruf geht per HTTP-POST an den oeffentlichen Endpoint der
# deployten App (kein Auth noetig — siehe #162). Die Versionszeile liegt in der
# DB; der Bump ist daher KEIN Commit und loest den Workflow nicht erneut aus.
on:
  push:
    branches: [main]

# Mehrere schnell aufeinanderfolgende Pushes nicht parallel inkrementieren.
concurrency:
  group: increment-app-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - name: POST increment-minor an die deployte App
        env:
          # Basis-URL der erreichbaren App (z. B. https://tools.mwolff.org).
          # Als Repository-Secret hinterlegen. Fehlt es, wird sauber uebersprungen.
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          # #223: Ein fehlendes Secret darf NICHT mehr still uebersprungen werden,
          # sonst bleibt die Version unbemerkt stehen. Wir setzen eine GitHub-
          # Actions-Warnung (im Run-Summary sichtbar) und brechen den Step ab.
          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "::warning title=Versions-Inkrement uebersprungen::APP_BASE_URL-Secret nicht gesetzt — Minor-Version wird nicht erhoeht (siehe #223)."
            exit 1
          fi
          echo "Inkrementiere Minor-Version unter ${APP_BASE_URL} ..."
          # --fail faerbt den Step bei HTTP-Fehlern (404/502/Timeout) rot, statt sie zu schlucken.
          if ! curl --fail --silent --show-error --max-time 30 \
            -X POST "${APP_BASE_URL%/}/api/app/version/increment-minor"; then
            echo "::error title=Versions-Inkrement fehlgeschlagen::POST an ${APP_BASE_URL%/}/api/app/version/increment-minor war nicht erfolgreich (Endpoint nicht erreichbar?, siehe #223)."
            exit 1
          fi
          echo ""
          echo "Minor-Version erhoeht."
