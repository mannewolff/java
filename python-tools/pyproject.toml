[project]
name = "python-tools"
version = "0.1.0"
description = "FastAPI-Microservice fuer Bild-Werkzeuge der Toolbox (rembg, pillow, colorthief)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",
    "rembg==2.0.59",
    "pillow==11.0.0",
    "colorthief==0.2.1",
    "cairosvg==2.7.1",
    "markdown>=3.10.2",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "mypy==1.13.0",
    "ruff==0.8.4",
    "types-Pillow==10.2.0.20240822",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "S",             # flake8-bandit
    "A",             # flake8-builtins
    "ARG",           # flake8-unused-arguments
    "PTH",           # flake8-use-pathlib
    "RET",           # flake8-return
    "TRY",           # tryceratops
    "D",             # pydocstyle
]
ignore = [
    "D203",  # one-blank-line-before-class (kollidiert mit D211)
    "D213",  # multi-line-summary-second-line (kollidiert mit D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert ist in pytest erwuenscht
    "D",     # Docstrings in Tests optional
    "ARG",   # Fixture-Argumente sind oft "unbenutzt"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# rembg + colorthief liefern keine Typ-Stubs aus.
module = ["rembg.*", "colorthief.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-branch",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["main"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
