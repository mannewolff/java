services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Wird vom Init-Script in infra/mariadb/init gelesen, um den Keycloak-DB-User anzulegen.
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      # Init-Scripts laufen NUR beim ersten Start (leeres Datenverzeichnis). Bei bestehendem
      # mariadb-data-Volume muss das Keycloak-Schema manuell angelegt werden — siehe
      # infra/keycloak/README.md.
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Kein Host-Port-Mapping — Spring und Keycloak erreichen mariadb intern unter mariadb:3306.
    # Falls von ausserhalb zugegriffen werden soll, hier z.B. ein "3307:3306" eintragen.

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      # Bootstrap-Admin (Keycloak 26+ Variante). Nur fuer den ersten Start — danach via
      # Keycloak-UI rotieren.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Datenbank: gemeinsame MariaDB, eigenes Schema "keycloak", eigener DB-User.
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Health-Endpoints (Port 9000) fuer Docker-Healthcheck.
      KC_HEALTH_ENABLED: "true"
      # Wir laufen lokal hinter keinem Reverse-Proxy — http im Admin-Konsolen-Modus erlauben.
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      # Default-secure: nur Loopback. Browser auf demselben Host (Dev) erreichen
      # Keycloak unter http://localhost:8081/, auf Prod liefert der Reverse-Proxy
      # 443 → 127.0.0.1:8081. Wer extern an Keycloak vorbei am Proxy will, muss
      # das im docker-compose.override.yml explizit aufmachen.
      - "127.0.0.1:8081:8080"
    volumes:
      # Realm-JSONs werden beim ersten Start importiert. User-Daten / Secrets sind hier
      # bewusst nicht enthalten — die Files sind Code, nicht Backup.
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # /dev/tcp ist ein Bash-Builtin und im Keycloak-Image (UBI + Bash) verfuegbar. Wir
      # pingen den Keycloak-Management-Port 9000 (Health-Endpoint) per simpler TCP-Probe.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  python-tools:
    build: ./python-tools
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      python-tools:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHON_TOOLS_URL: http://python-tools:8000
    ports:
      - "8080:8080"

volumes:
  mariadb-data:
