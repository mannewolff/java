# Produktions-Profil. Aktiv via SPRING_PROFILES_ACTIVE=prod.
# In docker-compose.prod.yml.example wird das ENV beim api-Service gesetzt;
# beim Kopieren als docker-compose.override.yml ist es automatisch aktiv.
# Keycloak liegt unter eigener Subdomain mit TLS — issuer-uri ist Production-Realm.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://toolboxauth.mwolff.org/realms/toolbox}

# OpenAPI-Spec und Swagger-UI in Produktion abschalten (#311): die anonyme Freigabe der
# Doku-Pfade (permitAll in SecurityConfig) würde sonst die komplette API-Fläche
# unauthentifiziert offenlegen. In Dev bleibt Swagger aktiv (application.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
